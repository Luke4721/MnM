<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#18181b" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO & Metadata -->
  <title>Monks & Monkeys Travels | Your Next Great Adventure</title>
  <meta name="description" content="Discover the world's leading travel agency. We curate extraordinary journeys and customized travel packages across the globe." />
  
  <!-- Open Graph / Social Media Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Monks & Monkeys Travels" />
  <meta property="og:description" content="Discover the world's leading travel agency. We curate extraordinary journeys and customized travel packages across the globe." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="https://images.unsplash.com/photo-1561361513-2d000a50f0dc?auto=format&fit=crop&w=2400&q=85">

  <!-- MNM Concierge chatbot (100% client-side, menu-driven FAQ assistant) -->
  <link rel="stylesheet" href="/assets/css/mnm-chatbot.css" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.unregister();
          console.log('Zombie Service Worker Unregistered');
        }
      });
    }
    // Force clear caches
    if ('caches' in window) {
      caches.keys().then((names) => {
        names.forEach(name => caches.delete(name));
      });
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- MNM Concierge chatbot (100% client-side, menu-driven FAQ assistant) -->
  <script src="/assets/js/mnm-chatbot.js" defer></script>
</body>

</html>
